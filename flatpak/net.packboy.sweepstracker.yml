# Flatpak build of Sweeps Tracker, made by .github/workflows/release-builds.yml.
#
# To build and install it on a Linux machine with flatpak-builder:
#   flatpak-builder --user --install --install-deps-from=flathub --force-clean \
#       build-dir flatpak/net.packboy.sweepstracker.yml
app-id: net.packboy.sweepstracker
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sweeps-tracker
finish-args:
  # Window and graphics.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # SweepsGrail list, casino logos and the update check.
  - --share=network
  # Project folders can live anywhere in your home folder.
  - --filesystem=home
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: sweeps-tracker
    buildsystem: simple
    build-options:
      # Cargo downloads the crates while building (fine outside Flathub, which would want
      # them vendored instead).
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/sweeps-tracker/cargo
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/sweeps-tracker /app/bin/sweeps-tracker
      - install -Dm644 flatpak/net.packboy.sweepstracker.desktop /app/share/applications/net.packboy.sweepstracker.desktop
      - install -Dm644 flatpak/net.packboy.sweepstracker.png /app/share/icons/hicolor/512x512/apps/net.packboy.sweepstracker.png
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - dist
          - .flatpak-builder
          - flatpak_app
