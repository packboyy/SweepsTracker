[package]
name = "sweeps-tracker"
version = "0.2.0"
edition = "2021"
description = "Track sweepstakes casino spending, coin discounts and withdrawals"

[dependencies]
eframe = "0.29"
# Images are decoded by egui_extras; downloading (with a disk cache) is src/logos.rs.
egui_extras = { version = "0.29", features = ["datepicker", "image"] }
# Decoders for casino logos (SweepsGrail serves webp, jpg and png).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Fetching and parsing the SweepsGrail casino list.
ureq = "2"
scraper = "0.20"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Project database (SQLite compiled in, so nothing to install on any OS).
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
# Native folder picker for opening / creating projects.
rfd = "0.15"

# Native macOS menu bar (File / Edit / View / Window / Help).
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.15"

[profile.release]
opt-level = 3
strip = true

# Local copy of egui_extras 0.29.1 with two changes: the date picker circles *today* using
# the local date instead of UTC (vendor/egui_extras/src/datepicker/popup.rs), and a clipped
# table column no longer grows to fit its widest content (vendor/egui_extras/src/table.rs).
[patch.crates-io]
egui_extras = { path = "vendor/egui_extras" }
